<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a0f0d">
<meta name="description" content="Live chess with ratings, challenges, reactions and a soundboard.">
<title>Chess</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%99%9F%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/chess.css">
</head>
<body>

<!-- ============================== SIGN IN ============================== -->
<section class="view" id="viewAuth">
  <div class="auth-card">
    <div class="logo big" aria-hidden="true">♟</div>
    <h1>CHESS</h1>
    <p class="auth-note" id="authNote">Use your account from the site, or make a new one.</p>
    <input class="field" id="authUser" placeholder="Username" autocomplete="username" autocapitalize="off" spellcheck="false" maxlength="40">
    <input class="field" id="authPass" type="password" placeholder="Password" autocomplete="current-password" maxlength="60">
    <div class="auth-status" id="authStatus" role="status"></div>
    <button class="btn primary wide" id="authLogin">Log in</button>
    <button class="btn wide" id="authCreate">Create account</button>
    <button class="linkish" id="authGuest">Just play the computer, no account</button>
    <a class="linkish" href="../">← Back to the phone</a>
  </div>
</section>

<!-- =============================== LOBBY =============================== -->
<section class="view" id="viewLobby">
  <header class="bar">
    <a class="back" href="../">← Phone</a>
    <div class="brand"><span class="logo" aria-hidden="true">♟</span><span>CHESS</span></div>
    <button class="me" id="meBox" title="Your profile"></button>
    <button class="icon-btn" id="lobbySettings" title="Settings" aria-label="Settings">⚙️</button>
  </header>

  <main class="lobby">
    <div class="hero">
      <p class="welcome" id="welcome">Pick a way to play.</p>
      <div id="resumeBox"></div>
      <div class="plays">
        <button class="play main" id="playQuick"><span class="play-e">⚡</span><span class="play-t">Quick match</span><span class="play-s">Play whoever is online</span></button>
        <button class="play" id="playFriend"><span class="play-e">🤝</span><span class="play-t">Challenge a friend</span><span class="play-s">Live, and in Messages</span></button>
        <button class="play" id="playLink"><span class="play-e">🔗</span><span class="play-t">Invite with a link</span><span class="play-s">Text it or Gmail it</span></button>
        <button class="play" id="playAi"><span class="play-e">🤖</span><span class="play-t">Play the computer</span><span class="play-s">Eight opponents</span></button>
        <button class="play" id="playLocal"><span class="play-e">👥</span><span class="play-t">Pass &amp; play</span><span class="play-s">Two players, one screen</span></button>
      </div>
    </div>

    <div class="panels">
      <section class="panel">
        <h2>Challenges</h2>
        <div class="list" id="openList"></div>
      </section>
      <section class="panel">
        <h2>Players <span class="count" id="onlineCount"></span></h2>
        <div class="list" id="playersList"></div>
      </section>
      <section class="panel">
        <h2>Live games</h2>
        <div class="list" id="liveList"></div>
      </section>
      <section class="panel">
        <h2>🏆 Ladder</h2>
        <div class="list" id="ladderList"></div>
      </section>
    </div>
    <footer class="foot">Made by <span class="gold">👑 Colton</span></footer>
  </main>
</section>

<!-- =============================== GAME ================================ -->
<section class="view" id="viewGame">
  <header class="bar">
    <button class="back" id="gBack">← Lobby</button>
    <div class="gtitle"><span id="gTitle"></span><span class="chaos" id="gChaos" title="The console was used in this game, so it does not count for rating">😈 CHAOS MODE</span></div>
    <button class="icon-btn" id="gSound" title="Sound on or off" aria-label="Sound on or off">🔊</button>
    <button class="icon-btn" id="gSettings" title="Settings" aria-label="Settings">⚙️</button>
  </header>

  <div class="gmain">
    <div class="gboard">
      <div class="plate" id="plateTop"></div>
      <div class="board-wrap" id="boardWrap">
        <div id="board"></div>
        <div class="promo-veil" id="promoVeil"></div>
        <div class="promo" id="promo"></div>
      </div>
      <div class="plate" id="plateBot"></div>
      <div class="gstatus" id="gStatus" role="status"></div>
      <div class="react-bar" id="reactBar" aria-label="Reactions"></div>
    </div>

    <aside class="gside">
      <div class="draw-bar" id="drawBar"></div>
      <div class="tabs" role="tablist">
        <button class="tab on" data-tab="moves">Moves</button>
        <button class="tab" data-tab="chat">Chat <span class="badge" id="chatBadge"></span></button>
        <button class="tab" data-tab="sounds">Soundboard</button>
      </div>
      <div class="pane on" data-pane="moves"><div class="moves" id="moveList"></div></div>
      <div class="pane" data-pane="chat">
        <div class="chat" id="chatList"></div>
        <div class="chat-in"><input class="field" id="chatInput" placeholder="Say something nice…" maxlength="200" autocomplete="off"><button class="btn small primary" id="chatSend">Send</button></div>
      </div>
      <div class="pane" data-pane="sounds"><div class="sound-grid" id="soundGrid"></div></div>
      <div class="actions">
        <button class="btn small" id="actDraw">🤝 Draw</button>
        <button class="btn small" id="actResign">🏳️ Resign</button>
        <button class="btn small" id="actUndo">↩️ Undo</button>
        <button class="btn small primary" id="actRematch">🔁 Rematch</button>
        <button class="btn small" id="actFlip">🔃 Flip</button>
        <button class="btn small" id="actShare">📤 Share</button>
      </div>
    </aside>
  </div>
</section>

<canvas id="fx" aria-hidden="true"></canvas>
<div id="modal" class="modal" role="dialog" aria-modal="true"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>

<noscript><p style="color:#fff;padding:2rem;font-family:sans-serif">Chess needs JavaScript turned on.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
