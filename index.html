<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
  <title>Colton's Site</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #000;
      font-family: 'Courier New', Courier, monospace;
      color: #00ff41;
      -webkit-text-size-adjust: 100%;
    }
    #bgImage {
      position: fixed; inset: 0; z-index: 0;
      background-size: cover; background-position: center; background-repeat: no-repeat;
      pointer-events: none;
    }
    #matrix {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: block;
      z-index: 1;
    }
    #menuBtn {
      position: fixed; top: 1rem; right: 1rem; z-index: 40;
      width: 42px; height: 42px; border-radius: 8px;
      background: rgba(0,10,3,0.6); border: 1px solid #00ff4166; color: #00ff41;
      font-size: 1.4rem; cursor: pointer; font-family: inherit;
      box-shadow: 0 0 10px rgba(0,255,65,0.3);
    }
    #menuBtn:hover { background: #00ff41; color: #000; }
    #bgMenu {
      position: fixed; top: 3.6rem; right: 1rem; z-index: 40;
      display: none; flex-direction: column; gap: 4px; width: 215px;
      background: rgba(0,12,4,0.96); border: 1px solid #00ff4166;
      border-radius: 10px; padding: 8px; box-shadow: 0 0 18px rgba(0,255,65,0.4);
    }
    #bgMenu.open { display: flex; }
    #bgMenu .menu-title {
      color: #00ff41aa; font-size: 0.72rem; letter-spacing: 0.15em;
      text-transform: uppercase; padding: 2px 6px 6px;
    }
    #bgMenu button {
      text-align: left; background: rgba(0,0,0,0.4); border: 1px solid #00ff4133;
      color: #baffcf; border-radius: 6px; padding: 0.5rem 0.7rem;
      font-family: inherit; font-size: 0.9rem; cursor: pointer;
    }
    #bgMenu button:hover { background: #00ff41; color: #000; }

    /* ---- Air Hockey ---- */
    .ah-wrap { width: min(100%, 460px); height: 100%; margin: 0 auto; display: flex; flex-direction: column; }
    .ah-top {
      display: flex; align-items: center; gap: 0.8rem; padding: 1rem;
      padding-top: calc(1rem + env(safe-area-inset-top)); border-bottom: 1px solid #00ff4133;
    }
    .ah-top .back { cursor: pointer; font-size: 1.3rem; color: #00ff41; background: none; border: none; font-family: inherit; }
    .ah-coins { color: #ffd24a; font-size: 1rem; }
    .ah-title { margin-left: auto; color: #00ff41; letter-spacing: 0.12em; text-shadow: 0 0 10px #00ff41; }
    .ah-view { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.8rem; padding: 1rem; overflow: hidden; }
    .ah-btn {
      width: min(80%, 260px); padding: 0.9rem; font-family: inherit; font-size: 1.1rem;
      font-weight: bold; letter-spacing: 0.1em; color: #00ff41; background: rgba(0,0,0,0.4);
      border: 2px solid #00ff41; border-radius: 6px; cursor: pointer; text-transform: uppercase;
      box-shadow: 0 0 10px rgba(0,255,65,0.3);
    }
    .ah-btn:hover { background: #00ff41; color: #000; }
    .ah-btn:disabled { opacity: 0.5; cursor: default; }
    .ah-btn.ghost { border-color: #00ff4177; color: #00ff41aa; box-shadow: none; }
    .ah-sub { color: #00ff41; letter-spacing: 0.15em; text-transform: uppercase; font-size: 0.9rem; }
    .skins { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.7rem; width: 100%; max-width: 360px; overflow-y: auto; padding: 2px; }
    .skin { border: 1px solid #00ff4144; border-radius: 10px; padding: 0.6rem 0.3rem; text-align: center; cursor: pointer; background: rgba(0,0,0,0.4); }
    .skin.owned { border-color: #00ff4188; }
    .skin.active { box-shadow: 0 0 14px #00ff41; border-color: #00ff41; }
    .skin .disc { width: 44px; height: 44px; border-radius: 50%; margin: 0 auto 4px; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; }
    .skin .nm { font-size: 0.72rem; color: #baffcf; }
    .skin .cost { font-size: 0.7rem; color: #ffd24a; margin-top: 2px; }
    .ah-score { font-size: 1.6rem; color: #00ff41; text-shadow: 0 0 10px #00ff41; }
    .ah-opp-name { font-size: 0.85rem; color: #00ff41aa; margin-bottom: 0.3rem; }
    #ahCanvas { background: #001206; border: 1px solid #00ff4155; border-radius: 10px; touch-action: none; max-width: 100%; }
    .ah-hint { font-size: 0.72rem; color: #00ff4188; margin-top: 0.5rem; text-align: center; }
    .players { display: flex; flex-direction: column; gap: 0.5rem; width: 100%; max-width: 340px; overflow-y: auto; }
    .player-row { display: flex; align-items: center; justify-content: space-between; padding: 0.5rem 0.8rem; border: 1px solid #00ff4133; border-radius: 8px; color: #baffcf; }
    .duel-btn { background: #00ff41; color: #000; border: none; border-radius: 6px; padding: 0.4rem 0.8rem; font-family: inherit; font-weight: bold; cursor: pointer; font-size: 0.8rem; }
    .duel-btn:hover { box-shadow: 0 0 10px #00ff41; }
    .bracket { display: flex; flex-direction: column; gap: 0.4rem; width: 100%; max-width: 320px; overflow-y: auto; }
    .match { display: flex; justify-content: space-between; gap: 0.5rem; padding: 0.4rem 0.7rem; border: 1px solid #00ff4133; border-radius: 6px; font-size: 0.85rem; color: #baffcf; }
    .match.done { opacity: 0.5; }
    .match.next { border-color: #00ff41; box-shadow: 0 0 8px rgba(0,255,65,0.3); }
    .ah-result {
      position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 1rem; background: rgba(0,4,1,0.88);
    }
    .ah-result-text { font-size: 1.5rem; color: #00ff41; text-shadow: 0 0 12px #00ff41; text-align: center; padding: 0 1rem; white-space: pre-line; }
    #ahGoalBanner {
      position: absolute; inset: 0; z-index: 6; display: none;
      align-items: center; justify-content: center; pointer-events: none;
      font-size: clamp(2rem, 11vw, 5rem); font-weight: bold; letter-spacing: 0.04em;
      white-space: nowrap; text-align: center; padding: 0 0.5rem;
      color: #fff; text-shadow: 0 0 20px #00ff41, 0 0 45px #00ff41; -webkit-text-stroke: 2px #00ff41;
    }
    #ahGoalBanner.show { display: flex; animation: goalPop 1.9s ease; }
    @keyframes goalPop {
      0% { transform: scale(0.3); opacity: 0; }
      12% { transform: scale(1.15); opacity: 1; }
      85% { transform: scale(1.04); opacity: 1; }
      100% { transform: scale(1); opacity: 0; }
    }

    /* ---- Screen system ---- */
    .screen {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100vh; height: 100dvh;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: transform 0.8s cubic-bezier(0.7, 0, 0.3, 1), opacity 0.6s ease;
    }
    .screen.hidden-up { transform: translateY(-100%); opacity: 0; pointer-events: none; }
    .screen.inactive  { opacity: 0; pointer-events: none; }

    /* ---- Intro ---- */
    .title {
      color: #00ff41;
      font-size: clamp(2.5rem, 9vw, 7rem);
      font-weight: bold;
      letter-spacing: 0.1em;
      text-shadow: 0 0 10px #00ff41, 0 0 20px #00ff41, 0 0 40px #00ff41, 0 0 80px #008f11;
      animation: flicker 3s infinite alternate;
      user-select: none;
      text-align: center;
    }
    @keyframes flicker {
      0%, 92%, 100% { opacity: 1; }
      93% { opacity: 0.6; } 94% { opacity: 1; }
      96% { opacity: 0.4; } 97% { opacity: 1; }
    }
    .btn {
      margin-top: 2.5rem;
      padding: 0.9rem 3rem;
      font-family: inherit;
      font-size: clamp(1rem, 3vw, 1.6rem);
      font-weight: bold;
      letter-spacing: 0.15em;
      color: #00ff41;
      background: rgba(0, 0, 0, 0.4);
      border: 2px solid #00ff41;
      border-radius: 4px;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 0 10px #00ff41, inset 0 0 10px rgba(0, 255, 65, 0.2);
      transition: all 0.25s ease;
    }
    .btn:hover { background: #00ff41; color: #000; box-shadow: 0 0 25px #00ff41, 0 0 50px #00ff41; transform: scale(1.05); }
    .btn:active { transform: scale(0.97); }

    /* ---- Login (red) ---- */
    .login-box {
      width: min(90%, 380px);
      padding: 2.2rem 2rem;
      background: rgba(20, 0, 0, 0.72);
      border: 2px solid #ff0033;
      border-radius: 10px;
      box-shadow: 0 0 25px rgba(255, 0, 51, 0.6), inset 0 0 20px rgba(255, 0, 51, 0.15);
      color: #ff3355;
      text-align: center;
    }
    .login-box h2 {
      font-size: 1.9rem;
      letter-spacing: 0.2em;
      text-shadow: 0 0 12px #ff0033;
      margin-bottom: 1.4rem;
      text-transform: uppercase;
    }
    .field {
      width: 100%;
      margin-bottom: 1rem;
      padding: 0.8rem 1rem;
      background: rgba(0,0,0,0.5);
      border: 1px solid #ff0033;
      border-radius: 5px;
      color: #ff5566;
      font-family: inherit;
      font-size: 1rem;
      outline: none;
    }
    .field:focus { box-shadow: 0 0 12px #ff0033; }
    .pass-wrap { position: relative; }
    .pass-wrap .field { margin-bottom: 1rem; padding-right: 2.8rem; }
    .eye-btn {
      position: absolute; right: 0.6rem; top: 0.65rem;
      background: none; border: none; cursor: pointer; font-size: 1.1rem;
      opacity: 0.7; padding: 0.2rem; line-height: 1;
    }
    .eye-btn:hover { opacity: 1; }
    .trust {
      display: flex; align-items: center; gap: 0.5rem;
      font-size: 0.85rem; color: #ff6677;
      margin: 0.3rem 0 1.2rem; cursor: pointer; user-select: none; text-align: left;
    }
    .trust input { width: 16px; height: 16px; accent-color: #ff0033; }
    .btn-red {
      width: 100%; padding: 0.8rem;
      font-family: inherit; font-size: 1.05rem; font-weight: bold; letter-spacing: 0.12em;
      color: #ff3355; background: rgba(0,0,0,0.4);
      border: 2px solid #ff0033; border-radius: 5px; cursor: pointer; text-transform: uppercase;
      box-shadow: 0 0 10px #ff0033, inset 0 0 10px rgba(255,0,51,0.2);
      transition: all 0.2s ease; margin-bottom: 0.7rem;
    }
    .btn-red:hover { background: #ff0033; color: #000; box-shadow: 0 0 25px #ff0033; }
    .btn-red.ghost { background: none; border-color: #ff003377; color: #ff5566aa; box-shadow: none; margin-bottom: 0; }
    .btn-red.ghost:hover { border-color: #ff0033; color: #ff3355; }
    .status { min-height: 1.1rem; font-size: 0.82rem; color: #ff8899; margin-bottom: 0.8rem; }

    /* ---- Home ---- */
    .home-inner {
      width: 100%; height: 100%;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 2rem 1rem 1.5rem;
    }
    .home-header { text-align: center; }
    .home-header .welcome { font-size: 1rem; color: #00ff41cc; letter-spacing: 0.2em; }
    .home-header .user { font-size: 2rem; color: #00ff41; text-shadow: 0 0 15px #00ff41; margin-top: 0.3rem; }
    .logout {
      position: absolute; top: 1rem; left: 1rem;
      font-size: 0.75rem; color: #00ff4199;
      background: none; border: 1px solid #00ff4155;
      padding: 0.35rem 0.7rem; border-radius: 4px; cursor: pointer; font-family: inherit;
    }
    .logout:hover { color: #00ff41; border-color: #00ff41; }
    .dock { display: flex; justify-content: center; gap: 1.6rem; padding-bottom: 0.5rem; }
    .app {
      width: 78px; height: 78px; border-radius: 18px;
      background: rgba(0, 20, 5, 0.75); border: 1px solid #00ff4155;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.2rem; cursor: pointer;
      box-shadow: 0 0 12px rgba(0,255,65,0.25); transition: all 0.2s ease;
    }
    .app:hover { transform: translateY(-6px) scale(1.05); box-shadow: 0 0 22px rgba(0,255,65,0.6); }
    .app .label { position: absolute; margin-top: 62px; font-size: 0.65rem; color: #00ff41aa; }
    .app.locked { color: #00ff4166; }

    /* ---- Messages app ---- */
    .msg-app {
      width: min(100%, 480px); height: 100%; margin: 0 auto;
      background: rgba(0, 8, 3, 0.9);
      border-left: 1px solid #00ff4133; border-right: 1px solid #00ff4133;
      display: flex; flex-direction: column;
    }
    .msg-top {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem; border-bottom: 1px solid #00ff4133;
      padding-top: calc(1rem + env(safe-area-inset-top));
    }
    .msg-top .back { cursor: pointer; font-size: 1.3rem; color: #00ff41; background: none; border: none; font-family: inherit; }
    .msg-top .heading { font-size: 1.2rem; letter-spacing: 0.15em; color: #00ff41; text-shadow: 0 0 10px #00ff41; }
    .msg-top .plus {
      cursor: pointer; font-size: 1.5rem; color: #00ff41;
      background: none; border: 1px solid #00ff4155; border-radius: 50%;
      width: 34px; height: 34px; line-height: 1; font-family: inherit;
    }
    .msg-top .plus:hover { background: #00ff41; color: #000; }
    .conv-list { flex: 1; overflow-y: auto; }
    .conv {
      padding: 0.9rem 1rem; border-bottom: 1px solid #00ff4118; cursor: pointer;
      display: flex; flex-direction: column; gap: 0.2rem;
    }
    .conv:hover { background: rgba(0,255,65,0.06); }
    .conv .name { color: #00ff41; font-size: 1.05rem; }
    .conv .preview { color: #00ff4188; font-size: 0.8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .empty-note { padding: 2rem 1rem; text-align: center; color: #00ff4177; font-size: 0.9rem; line-height: 1.5; }
    .thread { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
    .msg-wrap { display: flex; flex-direction: column; max-width: 100%; }
    .msg-wrap.mine { align-items: flex-end; }
    .msg-wrap.theirs { align-items: flex-start; }
    .bubble { max-width: 75%; padding: 0.6rem 0.9rem; border-radius: 14px; font-size: 0.95rem; line-height: 1.35; word-wrap: break-word; cursor: pointer; user-select: none; }
    .bubble.me { background: #00662a; color: #d6ffe4; border-bottom-right-radius: 4px; }
    .bubble.them { background: rgba(0,255,65,0.12); color: #baffcf; border: 1px solid #00ff4133; border-bottom-left-radius: 4px; }
    .reacts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
    .chip {
      font-size: 0.72rem; background: rgba(0,0,0,0.5); border: 1px solid #00ff4144;
      border-radius: 10px; padding: 1px 6px; cursor: pointer; color: #baffcf; user-select: none;
    }
    .chip.mine { border-color: #00ff41; background: rgba(0,255,65,0.18); }
    #reactBar {
      position: fixed; display: none; gap: 4px; z-index: 20;
      background: rgba(0,12,4,0.96); border: 1px solid #00ff4166;
      border-radius: 22px; padding: 6px 9px; box-shadow: 0 0 16px rgba(0,255,65,0.45);
    }
    #reactBar button { background: none; border: none; font-size: 1.35rem; cursor: pointer; line-height: 1; padding: 2px 3px; transition: transform 0.12s ease; }
    #reactBar button:hover { transform: scale(1.3); }
    .composer {
      display: flex; gap: 0.5rem; padding: 0.8rem; border-top: 1px solid #00ff4133;
      padding-bottom: calc(0.8rem + env(safe-area-inset-bottom));
    }
    .composer input {
      flex: 1; padding: 0.7rem 1rem; background: rgba(0,0,0,0.5);
      border: 1px solid #00ff4155; border-radius: 20px; color: #d6ffe4;
      font-family: inherit; font-size: 16px; outline: none;
    }
    .composer input:focus { box-shadow: 0 0 10px rgba(0,255,65,0.4); }
    .composer button#sendBtn {
      padding: 0 1.2rem; background: #00ff41; color: #000; border: none;
      border-radius: 20px; font-family: inherit; font-weight: bold; cursor: pointer;
    }
    .gif-btn {
      flex: 0 0 40px; width: 40px; height: 40px; border-radius: 50%;
      border: 2px solid #00ff41; background: rgba(0,0,0,0.4); color: #00ff41;
      font-size: 1.5rem; line-height: 1; cursor: pointer; font-family: inherit;
      display: flex; align-items: center; justify-content: center; padding: 0;
      box-shadow: 0 0 8px rgba(0,255,65,0.3); transition: all 0.15s ease;
    }
    .gif-btn:hover { background: #00ff41; color: #000; }
    .gif-btn.active { background: #00ff41; color: #000; transform: rotate(45deg); }
    #gifPanel { display: none; flex-direction: column; border-top: 1px solid #00ff4133; max-height: 42vh; }
    #gifPanel.open { display: flex; }
    #gifSearch {
      margin: 0.6rem; padding: 0.6rem 0.9rem; background: rgba(0,0,0,0.5);
      border: 1px solid #00ff4155; border-radius: 16px; color: #d6ffe4;
      font-family: inherit; font-size: 16px; outline: none;
    }
    #gifSearch:focus { box-shadow: 0 0 10px rgba(0,255,65,0.4); }
    #gifPresets {
      display: flex; gap: 6px; overflow-x: auto; padding: 0 0.6rem 0.5rem; flex: 0 0 auto;
    }
    #gifPresets button {
      flex: 0 0 auto; white-space: nowrap; cursor: pointer; font-family: inherit;
      font-size: 0.8rem; color: #baffcf; background: rgba(0,0,0,0.5);
      border: 1px solid #00ff4155; border-radius: 14px; padding: 4px 10px;
    }
    #gifPresets button:hover { background: #00ff41; color: #000; }
    #gifResults {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
      padding: 0 0.6rem 0.6rem; overflow-y: auto;
    }
    #gifResults img { width: 100%; border-radius: 8px; cursor: pointer; display: block; aspect-ratio: 1; object-fit: cover; }
    #gifResults .note { grid-column: 1 / -1; color: #00ff4188; text-align: center; padding: 1rem; font-size: 0.85rem; }
    .bubble.gif { padding: 3px; background: transparent; border: none; }
    .bubble.gif img { max-width: 200px; width: 55vw; border-radius: 10px; display: block; }
  </style>
</head>
<body>
  <div id="bgImage"></div>
  <canvas id="matrix"></canvas>

  <!-- background menu -->
  <button id="menuBtn" aria-label="Menu">☰</button>
  <div id="bgMenu">
    <div class="menu-title">Background</div>
    <button data-anim="matrix">🟩 Matrix</button>
    <button data-anim="spiral">🌈 Rainbow Spiral</button>
    <button data-anim="pong">🏓 Pong (plays)</button>
    <button data-anim="foosball">⚽ Foosball (plays)</button>
    <button id="bgCats">🐱 Cats</button>
    <button id="bgUploadImg">🖼️ Upload Image</button>
    <button id="bgUploadGif">🎞️ Upload GIF</button>
  </div>
  <input type="file" id="bgFile" accept="image/*" style="display:none">

  <!-- ===== INTRO ===== -->
  <div class="screen" id="intro">
    <div class="title">Colton's Site</div>
    <button class="btn" id="letsGoBtn">Let's go!</button>
  </div>

  <!-- ===== LOGIN ===== -->
  <div class="screen inactive" id="login">
    <div class="login-box">
      <h2>Access</h2>
      <input class="field" id="loginUser" type="text" placeholder="username" autocomplete="username">
      <div class="pass-wrap">
        <input class="field" id="loginPass" type="password" placeholder="password" autocomplete="current-password">
        <button type="button" class="eye-btn" id="eyeBtn" aria-label="Show password">👁️</button>
      </div>
      <label class="trust">
        <input type="checkbox" id="trustDevice"> Always trust this device with logins
      </label>
      <div class="status" id="loginStatus"></div>
      <button class="btn-red" id="loginBtn">Log In</button>
      <button class="btn-red ghost" id="createBtn">Create Account</button>
    </div>
  </div>

  <!-- ===== HOME ===== -->
  <div class="screen inactive" id="home">
    <button class="logout" id="logoutBtn">Log out</button>
    <div class="home-inner">
      <div class="home-header">
        <div class="welcome">WELCOME BACK</div>
        <div class="user" id="homeUser">—</div>
      </div>
      <div class="dock">
        <div class="app" id="airHockeyApp">🏒<span class="label">Air Hockey</span></div>
        <div class="app" id="messagesApp">💬<span class="label">Messages</span></div>
        <div class="app locked" title="Coming soon">?</div>
      </div>
    </div>
  </div>

  <!-- ===== MESSAGES ===== -->
  <div class="screen inactive" id="messages">
    <div class="msg-app">
      <div id="listView" style="display:flex;flex-direction:column;height:100%;">
        <div class="msg-top">
          <button class="back" id="msgHome">‹</button>
          <div class="heading">Messages</div>
          <button class="plus" id="newChatBtn">+</button>
        </div>
        <div class="conv-list" id="convList"></div>
      </div>
      <div id="chatView" style="display:none;flex-direction:column;height:100%;">
        <div class="msg-top">
          <button class="back" id="chatBack">‹</button>
          <div class="heading" id="chatName">Contact</div>
          <span style="width:34px;"></span>
        </div>
        <div class="thread" id="thread"></div>
        <div id="gifPanel">
          <input id="gifSearch" type="text" placeholder="Search cats…">
          <div id="gifPresets"></div>
          <div id="gifResults"></div>
        </div>
        <div class="composer">
          <button id="gifBtn" class="gif-btn" title="Send a GIF">+</button>
          <input id="msgInput" type="text" placeholder="Type a message…">
          <button id="sendBtn">Send</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== AIR HOCKEY ===== -->
  <div class="screen inactive" id="airhockey">
    <div class="ah-wrap">
      <div class="ah-top">
        <button class="back" id="ahBack">‹</button>
        <div class="ah-coins">🪙 <span id="ahCoins">0</span></div>

  <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore, collection, doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc,
    query, where, onSnapshot, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCPkwQaND-E_uewYq5NLKpLBP9oUzyVAFs",
    authDomain: "colton-site.firebaseapp.com",
    projectId: "colton-site",
    storageBucket: "colton-site.firebasestorage.app",
    messagingSenderId: "565997166421",
    appId: "1:565997166421:web:63a24af02db08878fed9dc"
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  /* ===== MATRIX BACKGROUND ===== */
  const canvas = document.getElementById('matrix');
  const ctx = canvas.getContext('2d');
  const fontSize = 16;
  let columns, drops;
  const MODES = {
    intro:  { chars: 'アイウエオカキクケコサシスセソタチツテトABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%'.split(''), color: '#00ff41' },
    binary: { chars: ['0','1'], color: '#ff0033' },
    calm:   { chars: ['0','1'], color: '#00ff41' }
  };
  let mode = MODES.intro;
  function resize() {
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    columns = Math.floor(canvas.width / fontSize);
    drops = new Array(columns).fill(1);
  }
  resize();
  window.addEventListener('resize', resize);
  let activeAnim = 'matrix';
  let drawEnabled = true;
  let frame = 0;
  let pong, foos;
  const bgLayer = document.getElementById('bgImage');

  function drawMatrix() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = mode.color;
    ctx.font = fontSize + 'px monospace';
    for (let i = 0; i < drops.length; i++) {
      const text = mode.chars[Math.floor(Math.random() * mode.chars.length)];
      ctx.fillText(text, i * fontSize, drops[i] * fontSize);
      if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
  }

  function drawSpiral() {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    const cx = canvas.width / 2, cy = canvas.height / 2;
    const maxR = Math.hypot(cx, cy), pts = 260;
    for (let t = 0; t < pts; t++) {
      const ang = t * 0.3 + frame * 0.04, r = t * (maxR / pts);
      ctx.fillStyle = `hsl(${(t * 4 + frame * 2) % 360},100%,55%)`;
      ctx.beginPath(); ctx.arc(cx + r * Math.cos(ang), cy + r * Math.sin(ang), 7, 0, 7); ctx.fill();
    }
  }

  function initPong() {
    pong = { bx: canvas.width / 2, by: canvas.height / 2,
      vx: 4 * (Math.random() < .5 ? 1 : -1), vy: 3 * (Math.random() < .5 ? 1 : -1),
      lp: canvas.height / 2, rp: canvas.height / 2, ph: 90, pw: 12 };
  }
  function drawPong() {
    if (!pong) initPong();
    const p = pong;
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    p.bx += p.vx; p.by += p.vy;
    if (p.by < 12 || p.by > canvas.height - 12) p.vy *= -1;
    const s = 4.4;
    p.lp += Math.max(-s, Math.min(s, p.by - p.lp));
    p.rp += Math.max(-s, Math.min(s, p.by - p.rp));
    const lx = 34, rx = canvas.width - 34;
    if (p.bx < lx + p.pw && Math.abs(p.by - p.lp) < p.ph / 2 && p.vx < 0) p.vx *= -1;
    if (p.bx > rx - p.pw && Math.abs(p.by - p.rp) < p.ph / 2 && p.vx > 0) p.vx *= -1;
    if (p.bx < 0 || p.bx > canvas.width) initPong();
    ctx.strokeStyle = '#00ff4144'; ctx.lineWidth = 2; ctx.setLineDash([10, 16]);
    ctx.beginPath(); ctx.moveTo(canvas.width / 2, 0); ctx.lineTo(canvas.width / 2, canvas.height); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = '#00ff41';
    ctx.fillRect(lx, p.lp - p.ph / 2, p.pw, p.ph);
    ctx.fillRect(rx - p.pw, p.rp - p.ph / 2, p.pw, p.ph);
    ctx.fillRect(p.bx - 6, p.by - 6, 12, 12);
  }

  function initFoosball() {
    const cols = 6, rods = [];
    for (let i = 0; i < cols; i++)
      rods.push({ x: (i + 1) * canvas.width / (cols + 1), phase: Math.random() * 6.28, team: i % 2 });
    foos = { rods, bx: canvas.width / 2, by: canvas.height / 2,
      vx: 5 * (Math.random() < .5 ? 1 : -1), vy: 3 * (Math.random() < .5 ? 1 : -1) };
  }
  function drawFoosball() {
    if (!foos) initFoosball();
    const f = foos;
    ctx.fillStyle = '#0a3d16'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = '#ffffff33'; ctx.lineWidth = 2;
    ctx.strokeRect(10, 10, canvas.width - 20, canvas.height - 20);
    ctx.beginPath(); ctx.moveTo(canvas.width / 2, 10); ctx.lineTo(canvas.width / 2, canvas.height - 10); ctx.stroke();
    ctx.beginPath(); ctx.arc(canvas.width / 2, canvas.height / 2, 55, 0, 7); ctx.stroke();
    f.bx += f.vx; f.by += f.vy;
    if (f.by < 20 || f.by > canvas.height - 20) f.vy *= -1;
    if (f.bx < 8 || f.bx > canvas.width - 8) initFoosball();
    const ph = 46, pw = 16, sp = canvas.height / 4;
    f.rods.forEach(r => {
      const off = Math.sin(frame * 0.03 + r.phase) * sp * 0.45;
      ctx.strokeStyle = '#dddddd55'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(r.x, 0); ctx.lineTo(r.x, canvas.height); ctx.stroke();
      ctx.fillStyle = r.team ? '#ff3b52' : '#3aa0ff';
      for (let j = 0; j < 3; j++) {
        const py = sp * (j + 1) + off;
        ctx.fillRect(r.x - pw / 2, py - ph / 2, pw, ph);
        if (Math.abs(f.bx - r.x) < pw / 2 + 8 && Math.abs(f.by - py) < ph / 2 + 8) { f.vx *= -1; f.bx += f.vx * 2; }
      }
    });
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(f.bx, f.by, 8, 0, 7); ctx.fill();
  }

  function tick() {
    frame++;
    if (!drawEnabled) return;
    if (activeAnim === 'spiral') drawSpiral();
    else if (activeAnim === 'pong') drawPong();
    else if (activeAnim === 'foosball') drawFoosball();
    else drawMatrix();
  }
  setInterval(tick, 33);

  function setAnim(name) {
    activeAnim = name; drawEnabled = true;
    bgLayer.style.backgroundImage = 'none';
    if (name === 'pong') initPong();
    else if (name === 'foosball') initFoosball();
    else if (name === 'matrix') drops = new Array(columns).fill(1);
  }
  function setImage(url) {
    drawEnabled = false;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    bgLayer.style.backgroundImage = `url("${url}")`;
  }

  /* ===== HELPERS ===== */
  const $ = id => document.getElementById(id);
  const canon = s => s.trim().toLowerCase();
  const pairId = (a, b) => [a, b].sort().join('__');

  /* ----- content filter: defeats spacing, punctuation, leetspeak, and repeats ----- */
  const LEET = {
    a:'a@4^', b:'b8', c:'c(<{[', d:'d', e:'e3', f:'f', g:'g69', h:'h',
    i:'i1!|', j:'j', k:'k', l:'l', m:'m', n:'n', o:'o0', p:'p', q:'q',
    r:'r', s:'s5$', t:'t7+', u:'uv', v:'v', w:'w', x:'x', y:'y', z:'z2'
  };
  // longer words first so they censor fully before their shorter roots
  const RX_WORDS = [
    'motherfucker','bullshit','asshole','dickhead','dumbass','jackass',
    'fuck','fuk','fuc','fux','shit','shiet','shyt','sht','bitch','biatch',
    'ass','azz','dick','dik','piss','cunt','kunt','slut','whore','cock','kock',
    'pussy','pusy','nigger','nigga','niger','faggot','fagot','fag','retard',
    'bastard','wanker','twat','prick','jerkoff','damn'
  ];
  function wordRegex(w, lb) {
    const sep = '[\\s\\W_]*';                 // spaces / punctuation between letters
    let pat = lb ? '(?<![a-z])' : '';
    for (let i = 0; i < w.length; i++) {
      const cls = (LEET[w[i]] || w[i]).replace(/[\]\\^-]/g, '\\$&');
      pat += '[' + cls + ']+';                // '+' absorbs repeated letters (fuuuck)
      if (i < w.length - 1) pat += sep;
    }
    return pat + '(?![a-z])';
  }
  function buildBadRe(lb) { return new RegExp('(' + RX_WORDS.map(w => wordRegex(w, lb)).join('|') + ')', 'gi'); }
  let BAD_RE; try { BAD_RE = buildBadRe(true); } catch (e) { BAD_RE = buildBadRe(false); }
  const cleanText = t => { BAD_RE.lastIndex = 0; return String(t).replace(BAD_RE, m => '*'.repeat(m.length)); };
  const hasBad = t => { BAD_RE.lastIndex = 0; return BAD_RE.test(String(t)); };
  const TRUST_KEY = 'colton_user';
  let me = null; // logged-in username (canonical)

  function showScreen(id) {
    ['login','home','messages','airhockey'].forEach(s => $(s).classList.add('inactive'));
    $(id).classList.remove('inactive');
  }

  /* ===== INTRO -> LOGIN ===== */
  $('letsGoBtn').addEventListener('click', () => {
    const saved = localStorage.getItem(TRUST_KEY);
    if (saved) {                       // trusted device -> straight in
      me = saved;
      mode = MODES.calm;
      $('intro').classList.add('hidden-up');
      enterHome();
      return;
    }
    mode = MODES.binary;               // 1s and 0s, red
    $('intro').classList.add('hidden-up');
    $('login').classList.remove('inactive');
  });

  /* ===== ACCOUNTS (Firestore) ===== */
  async function createAccount() {
    const u = canon($('loginUser').value);
    const p = $('loginPass').value;
    if (!u || !p) { setStatus('Enter a username and password.'); return; }
    if (u.length < 2) { setStatus('Username too short.'); return; }
    setStatus('Checking…');
    try {
      const ref = doc(db, 'users', u);
      const snap = await getDoc(ref);
      if (snap.exists()) { setStatus('That username is taken — pick another.'); return; }
      await setDoc(ref, { username: u, password: p, createdAt: serverTimestamp() });
      finishLogin(u);
    } catch (e) { setStatus('Error: ' + e.message); }
  }

  async function logIn() {
    const u = canon($('loginUser').value);
    const p = $('loginPass').value;
    if (!u || !p) { setStatus('Enter a username and password.'); return; }
    setStatus('Signing in…');
    try {
      const snap = await getDoc(doc(db, 'users', u));
      if (!snap.exists()) { setStatus('No account with that name — try Create Account.'); return; }
      if (snap.data().password !== p) { setStatus('Wrong password.'); return; }
      finishLogin(u);
    } catch (e) { setStatus('Error: ' + e.message); }
  }

  function finishLogin(u) {
    me = u;
    if ($('trustDevice').checked) localStorage.setItem(TRUST_KEY, u);
    mode = MODES.calm;
    setStatus('');
    enterHome();
  }
  function setStatus(t) { $('loginStatus').textContent = t; }

  $('loginBtn').addEventListener('click', logIn);
  $('createBtn').addEventListener('click', createAccount);
  $('eyeBtn').addEventListener('click', () => {
    const f = $('loginPass');
    const show = f.type === 'password';
    f.type = show ? 'text' : 'password';
    $('eyeBtn').textContent = show ? '🙈' : '👁️';
    $('eyeBtn').setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  });

  function enterHome() {
    $('homeUser').textContent = me;
    showScreen('home');
  }

  $('logoutBtn').addEventListener('click', () => {
    localStorage.removeItem(TRUST_KEY);
    me = null;
    mode = MODES.intro;
    ['login','home','messages','airhockey'].forEach(s => $(s).classList.add('inactive'));
    $('intro').classList.remove('hidden-up');
  });

  /* ===== MESSAGES (Firestore, real-time) ===== */
  let unsubList = null, unsubThread = null, unsubReacts = null, currentContact = null;
  let threadMsgs = [], threadReacts = {}, activeMsgId = null;

  $('messagesApp').addEventListener('click', () => { $('menuBtn').style.display = 'none'; showScreen('messages'); openList(); });
  $('msgHome').addEventListener('click', () => { $('menuBtn').style.display = ''; stopList(); showScreen('home'); });

  function openList() {
    closeGif();
    $('listView').style.display = 'flex';
    $('chatView').style.display = 'none';
    stopThread();
    startList();
  }

  function startList() {
    stopList();
    const q = query(collection(db, 'messages'), where('participants', 'array-contains', me));
    unsubList = onSnapshot(q, snap => {
      const latest = {};
      snap.forEach(d => {
        const m = d.data();
        const other = m.from === me ? m.to : m.from;
        const t = m.createdAt ? m.createdAt.toMillis() : (m.clientTime || Date.now());
        const preview = m.type === 'gif' ? '🖼️ GIF' : cleanText(m.text);
        if (!latest[other] || t >= latest[other].t) latest[other] = { text: preview, t };
      });
      renderConvList(latest);
    }, err => {
      $('convList').innerHTML = '<div class="empty-note">Could not load. Make sure Firestore is enabled in test mode.<br><br>' + err.message + '</div>';
    });
  }
  function stopList() { if (unsubList) { unsubList(); unsubList = null; } }

  function renderConvList(latest) {
    const list = $('convList');
    const names = Object.keys(latest).sort((a,b) => latest[b].t - latest[a].t);
    if (names.length === 0) {
      list.innerHTML = '<div class="empty-note">No chats yet.<br>Tap the <b>+</b> in the top-right to look up someone by username and start texting.</div>';
      return;
    }
    list.innerHTML = '';
    names.forEach(name => {
      const div = document.createElement('div');
      div.className = 'conv';
      div.innerHTML = `<span class="name">${esc(name)}</span><span class="preview">${esc(latest[name].text)}</span>`;
      div.addEventListener('click', () => openChat(name));
      list.appendChild(div);
    });
  }

  /* + : look up a real account across the net, then open the chat */
  $('newChatBtn').addEventListener('click', async () => {
    const input = prompt('Look up an account to text (enter their username):');
    if (!input) return;
    const name = canon(input);
    if (!name) return;
    if (name === me) { alert("That's you!"); return; }
    try {
      const snap = await getDoc(doc(db, 'users', name));
      if (!snap.exists()) { alert('No user found with the name "' + name + '".'); return; }
      openChat(name);
    } catch (e) { alert('Error: ' + e.message); }
  });

  function openChat(name) {
    currentContact = name;
    $('chatName').textContent = name;
    $('listView').style.display = 'none';
    $('chatView').style.display = 'flex';
    closeGif();
    stopList();
    startThread();
    $('msgInput').focus();
  }
  $('chatBack').addEventListener('click', () => { stopThread(); openList(); });

  function startThread() {
    stopThread();
    const pid = pairId(me, currentContact);
    // live messages
    const mq = query(collection(db, 'messages'), where('pair', '==', pid));
    unsubThread = onSnapshot(mq, snap => {
      threadMsgs = [];
      snap.forEach(d => threadMsgs.push({ id: d.id, ...d.data() }));
      const key = m => m.createdAt ? m.createdAt.toMillis() : (m.clientTime || Date.now());
      threadMsgs.sort((a,b) => key(a) - key(b));
      renderThread();
    });
    // live reactions
    const rq = query(collection(db, 'reactions'), where('pair', '==', pid));
    unsubReacts = onSnapshot(rq, snap => {
      threadReacts = {};
      snap.forEach(d => {
        const r = d.data();
        (threadReacts[r.msgId] = threadReacts[r.msgId] || []).push({ id: d.id, emoji: r.emoji, from: r.from });
      });
      renderThread();
    });
  }
  function stopThread() {
    if (unsubThread) { unsubThread(); unsubThread = null; }
    if (unsubReacts) { unsubReacts(); unsubReacts = null; }
    threadMsgs = []; threadReacts = {};
  }

  function renderThread() {
    const thread = $('thread');
    thread.innerHTML = '';
    threadMsgs.forEach(m => {
      const wrap = document.createElement('div');
      wrap.className = 'msg-wrap ' + (m.from === me ? 'mine' : 'theirs');

      const b = document.createElement('div');
      b.className = 'bubble ' + (m.from === me ? 'me' : 'them');
      if (m.type === 'gif') {
        b.classList.add('gif');
        const img = document.createElement('img');
        img.src = m.text; img.alt = 'gif';
        b.appendChild(img);
      } else {
        b.textContent = cleanText(m.text);
      }
      b.addEventListener('contextmenu', e => { e.preventDefault(); openReactBar(e, m.id); });
      b.addEventListener('click', e => { e.stopPropagation(); openReactBar(e, m.id); });
      wrap.appendChild(b);

      const rs = threadReacts[m.id];
      if (rs && rs.length) {
        const chips = document.createElement('div');
        chips.className = 'reacts';
        const counts = {};
        rs.forEach(r => {
          counts[r.emoji] = counts[r.emoji] || { n: 0, mine: false };
          counts[r.emoji].n++;
          if (r.from === me) counts[r.emoji].mine = true;
        });
        Object.keys(counts).forEach(em => {
          const c = document.createElement('span');
          c.className = 'chip' + (counts[em].mine ? ' mine' : '');
          c.textContent = em + ' ' + counts[em].n;
          c.addEventListener('click', ev => { ev.stopPropagation(); toggleReaction(m.id, em); });
          chips.appendChild(c);
        });
        wrap.appendChild(chips);
      }
      thread.appendChild(wrap);
    });
    thread.scrollTop = thread.scrollHeight;
  }

  /* ----- reaction picker ----- */
  const REACTS = ['👍','❤️','😂','😮','😢','🔥','🐱'];
  const reactBar = document.createElement('div');
  reactBar.id = 'reactBar';
  REACTS.forEach(em => {
    const btn = document.createElement('button');
    btn.textContent = em;
    btn.addEventListener('click', ev => {
      ev.stopPropagation();
      if (activeMsgId) toggleReaction(activeMsgId, em);
      hideReactBar();
    });
    reactBar.appendChild(btn);
  });
  document.body.appendChild(reactBar);

  function openReactBar(e, msgId) {
    activeMsgId = msgId;
    reactBar.style.display = 'flex';
    const barW = 260, barH = 44;
    let x = (e.clientX != null ? e.clientX : window.innerWidth / 2) - barW / 2;
    let y = (e.clientY != null ? e.clientY : window.innerHeight / 2) - barH - 8;
    x = Math.max(8, Math.min(x, window.innerWidth - barW - 8));
    y = Math.max(8, y);
    reactBar.style.left = x + 'px';
    reactBar.style.top = y + 'px';
  }
  function hideReactBar() { reactBar.style.display = 'none'; activeMsgId = null; }
  document.addEventListener('click', hideReactBar);
  document.getElementById('thread').addEventListener('scroll', hideReactBar);

  async function toggleReaction(msgId, emoji) {
    const existing = (threadReacts[msgId] || []).find(r => r.from === me && r.emoji === emoji);
    try {
      if (existing) {
        await deleteDoc(doc(db, 'reactions', existing.id));
      } else {
        await addDoc(collection(db, 'reactions'), {
          pair: pairId(me, currentContact), msgId, emoji, from: me, clientTime: Date.now()
        });
      }
    } catch (e) { alert('Reaction failed: ' + e.message); }
  }

  async function sendMessage() {
    const input = $('msgInput');
    const raw = input.value.trim();
    if (!raw || !currentContact) return;
    const text = cleanText(raw);
    input.value = '';
    try {
      await addDoc(collection(db, 'messages'), {
        from: me,
        to: currentContact,
        participants: [me, currentContact],
        pair: pairId(me, currentContact),
        text,
        clientTime: Date.now(),
        createdAt: serverTimestamp()
      });
    } catch (e) { alert('Could not send: ' + e.message); input.value = text; }
  }
  $('sendBtn').addEventListener('click', sendMessage);
  $('msgInput').addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

  /* ----- GIF picker (GIPHY) ----- */
  const GIPHY_KEY = 'tyC31epHwRUPex8AME7WUOquGpmiqe33';
  let gifTimer = null;

  // quick-tap favorites — edit these labels/searches anytime

      const c = AC(); if (!c) return;
      const o = c.createOscillator(), g = c.createGain();
      o.type = type || 'square'; o.frequency.value = freq;
      o.connect(g); g.connect(c.destination);
      const t = c.currentTime; g.gain.setValueAtTime(vol || 0.15, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.start(t); o.stop(t + dur);
    }

          d[i] = (Math.random() * 2 - 1) * env;

        const src = c.createBufferSource(); src.buffer = buf;
        const g = c.createGain(); g.gain.value = 0.26; src.connect(g); g.connect(c.destination); src.start();

    function stepPuck(g, pvx, pvy, ovx, ovy) {
      const gap = g.W * 0.30;
      const steps = Math.max(1, Math.ceil(Math.hypot(g.bvx, g.bvy) / (g.kr * 0.7)));
      for (let st = 0; st < steps; st++) {
        g.bx += g.bvx / steps; g.by += g.bvy / steps;
        if (g.bx < g.kr) { g.bx = g.kr; g.bvx = Math.abs(g.bvx); wallSound(); }
        else if (g.bx > g.W - g.kr) { g.bx = g.W - g.kr; g.bvx = -Math.abs(g.bvx); wallSound(); }
        if (g.by < g.kr) { if (Math.abs(g.bx - g.W / 2) < gap / 2) return 'you'; g.by = g.kr; g.bvy = Math.abs(g.bvy); wallSound(); }
        else if (g.by > g.H - g.kr) { if (Math.abs(g.bx - g.W / 2) < gap / 2) return 'opp'; g.by = g.H - g.kr; g.bvy = -Math.abs(g.bvy); wallSound(); }
        collide(g.px, g.py, pvx, pvy);
        collide(g.ox, g.oy, ovx, ovy);
      }
      g.bvx *= 0.999; g.bvy *= 0.999;
      const s = Math.hypot(g.bvx, g.bvy); if (s > 13) { g.bvx *= 13 / s; g.bvy *= 13 / s; }
      return null;
    }
    function setCam(flip) {
      if (!three) return;
      if (flip) { three.camera.position.set(0, 13, -17.5); three.camera.lookAt(0, 0, 1.5); }
      else { three.camera.position.set(0, 13, 17.5); three.camera.lookAt(0, 0, -1.5); }
    }
    function update() {
      const g = game;
      const ppx = g.px, ppy = g.py, pox = g.ox, poy = g.oy;
      if (keyL) g.px -= 6; if (keyR) g.px += 6;
      if (keyU) g.py -= 6; if (keyD) g.py += 6;
      if (targetX != null) { g.px += (targetX - g.px) * 0.4; g.py += (targetY - g.py) * 0.4; }
      g.px = clamp(g.px, g.pr, g.W - g.pr);
      g.py = clamp(g.py, g.H * 0.52 + g.pr, g.H - g.pr);
      const tgt = (g.by < g.H * 0.5) ? g.bx : g.W / 2;
      g.ox += (tgt - g.ox) * 0.05 * (0.7 + g.cfg.diff);
      g.ox = clamp(g.ox, g.pr, g.W - g.pr);
      const tgtD = (g.by < g.H * 0.5) ? Math.min(g.by, g.H * 0.4) : g.H * 0.18;
      g.oy += (tgtD - g.oy) * 0.05; g.oy = clamp(g.oy, g.pr, g.H * 0.46);
      const pvx = g.px - ppx, pvy = g.py - ppy, ovx = g.ox - pox, ovy = g.oy - poy;
      const now = performance.now();
      if (g.freeze) { if (now < g.freeze) return; g.freeze = 0; g.bvx = (Math.random() * 2 - 1) * 2; g.bvy = g.serveDir * 3.4; }
      const who = stepPuck(g, pvx, pvy, ovx, ovy);
      if (who) { if (who === 'you') g.you++; else g.opp++; return goal(who); }
      $('ahYou').textContent = g.you; $('ahOpp').textContent = g.opp;
    }
    function collide(mx, my, pvx, pvy) {
      const g = game, dx = g.bx - mx, dy = g.by - my, d = Math.hypot(dx, dy), min = g.kr + g.pr;
      if (d < min && d > 0) {
        const nx = dx / d, ny = dy / d;
        g.bx = mx + nx * min; g.by = my + ny * min;
        let rvx = g.bvx - pvx, rvy = g.bvy - pvy;
        const vn = rvx * nx + rvy * ny;
        if (vn < 0) {
          const e = 1.05;
          rvx -= (1 + e) * vn * nx; rvy -= (1 + e) * vn * ny;
          g.bvx = rvx + pvx; g.bvy = rvy + pvy;
          hitSound();
        }
      }
    }
    function goal(who) {
      const g = game;
      if (who === 'you') setCoins(AH.coins + 5);
      showGoal(); goalSound();
      if (g.you >= g.cfg.target || g.opp >= g.cfg.target) return endMatch(g.you > g.opp);
      g.bx = g.W / 2; g.by = g.H / 2; g.bvx = 0; g.bvy = 0;
      g.serveDir = who === 'you' ? -1 : 1;
      g.freeze = performance.now() + 1700;
    }
    function render() {
      const g = game;
      three.youPad.position.set((g.px - g.W / 2) * S, 0, (g.py - g.H / 2) * S);
      three.oppPad.position.set((g.ox - g.W / 2) * S, 0, (g.oy - g.H / 2) * S);
      three.puck.position.set((g.bx - g.W / 2) * S, 0.15, (g.by - g.H / 2) * S);
      three.puck.rotation.y += 0.04;
      three.renderer.render(three.scene, three.camera);
    }
    function endMatch(won) {
      const cfg = game.cfg; stopGame();
      let reward = won ? 25 : 5, text;
      if (cfg.tournament && AH.tour) {
        if (won) {
          AH.tour.results[AH.tour.round] = '✅'; AH.tour.round++;
          const fin = AH.tour.round >= AH.tour.opponents.length;
          reward = fin ? 300 : 40 + AH.tour.round * 10;
          text = fin ? ('🏆 CHAMPION!\n+' + reward + ' 🪙') : ('Won! On to Round ' + (AH.tour.round + 1) + '\n+' + reward + ' 🪙');
          if (fin) AH.tour = null; save();
        } else { AH.tour.results[AH.tour.round] = '❌'; AH.tour = null; save(); text = 'Knocked out! 😿\n+' + reward + ' 🪙'; }
      } else { text = (won ? 'You win! 🎉' : 'You lost! 😿') + '\n+' + reward + ' 🪙'; }
      setCoins(AH.coins + reward);
      $('ahResultText').textContent = text;
      $('ahResult').style.display = 'flex';
      $('ahResultBtn').onclick = () => { $('ahResult').style.display = 'none'; if (cfg.tournament) openTour(); else ahView('ahMenu'); };
    }

    // ===== ONLINE DUEL =====
    let presenceTimer = null, unsubLobby = null, unsubIncoming = null, unsubDuel = null, unsubInviteDoc = null;
    let netState = null, netRole = null, netPhase = null, myDuelId = null, inviteTimer = null, netWriteT = 0, netEnded = false, currentInviteId = null;
    const seenInvites = new Set();

    function ding() { blip(880, 0.12, 'sine', 0.2); setTimeout(() => blip(1320, 0.18, 'sine', 0.2), 110); }
    function buzz() { blip(120, 0.35, 'sawtooth', 0.22); }
    function showNet(t, cancelable) { $('ahNetText').textContent = t; $('ahNetCancel').style.display = cancelable ? 'block' : 'none'; $('ahNet').style.display = 'flex'; }
    function hideNet() { $('ahNet').style.display = 'none'; }

    async function beat() { try { await setDoc(doc(db, 'presence', me), { user: me, lastSeen: serverTimestamp() }); } catch (e) {} }
    function startPresence() { beat(); if (!presenceTimer) presenceTimer = setInterval(beat, 8000); }
    function stopPresence() { if (presenceTimer) { clearInterval(presenceTimer); presenceTimer = null; } try { deleteDoc(doc(db, 'presence', me)); } catch (e) {} }

    function startIncoming() {
      stopIncoming();
      const q = query(collection(db, 'duels'), where('guest', '==', me));
      unsubIncoming = onSnapshot(q, snap => {
        snap.forEach(d => { const v = d.data(); if (v.status === 'pending' && !seenInvites.has(d.id) && netPhase == null) { seenInvites.add(d.id); showInvite(d.id, v.host); } });
      });
    }
    function stopIncoming() { if (unsubIncoming) { unsubIncoming(); unsubIncoming = null; } }

    function showInvite(id, host) {
      currentInviteId = id;
      $('ahInviteText').textContent = host + ' challenges you to a duel!';
      $('ahInvite').style.display = 'flex';
      if (unsubInviteDoc) unsubInviteDoc();
      unsubInviteDoc = onSnapshot(doc(db, 'duels', id), d => {
        const v = d.data();
        if ((!v || (v.status !== 'pending' && v.status !== 'accepted')) && netPhase == null) $('ahInvite').style.display = 'none';
      });
    }
    $('ahInviteYes').addEventListener('click', async () => {
      const id = currentInviteId; if (!id) return;
      $('ahInvite').style.display = 'none';
      try { await updateDoc(doc(db, 'duels', id), { status: 'accepted' }); } catch (e) {}
      ding();
      netRole = 'guest'; myDuelId = id; netPhase = 'playing'; netEnded = false;
      listenDuel(id); startNetGuest(id);
    });
    $('ahInviteNo').addEventListener('click', async () => {
      const id = currentInviteId; if (!id) return;
      $('ahInvite').style.display = 'none';
      try { await updateDoc(doc(db, 'duels', id), { status: 'rejected' }); } catch (e) {}
    });

    function openOnline() { startPresence(); startLobby(); ahView('ahOnline'); }
    function startLobby() {
      stopLobby();
      unsubLobby = onSnapshot(collection(db, 'presence'), snap => {
        const now = Date.now(), list = [];
        snap.forEach(d => { const v = d.data(); const t = v.lastSeen ? v.lastSeen.toMillis() : 0; if (v.user !== me && now - t < 30000) list.push(v.user); });
        renderPlayers(list);
      });
    }
    function stopLobby() { if (unsubLobby) { unsubLobby(); unsubLobby = null; } }
    function renderPlayers(list) {
      const box = $('ahPlayers'); box.innerHTML = '';
      if (!list.length) { box.innerHTML = '<div class="empty-note">No one else online right now.<br>Ask a friend to open Air Hockey → Online Duel!</div>'; return; }
      list.forEach(u => {
        const row = document.createElement('div'); row.className = 'player-row';
        row.innerHTML = `<span>🟢 ${esc(u)}</span>`;
        const btn = document.createElement('button'); btn.className = 'duel-btn'; btn.textContent = 'Duel Invite';
        btn.addEventListener('click', () => invite(u));
        row.appendChild(btn); box.appendChild(row);
      });
    }

    async function invite(guest) {
      const ref = doc(collection(db, 'duels'));
      myDuelId = ref.id; netRole = 'host'; netPhase = 'waiting'; netEnded = false;
      try {
        await setDoc(ref, { host: me, guest, status: 'pending', createdAt: serverTimestamp(),
          hp: { x: FW / 2, y: FH * 0.8 }, gp: { x: FW / 2, y: FH * 0.2 }, puck: { x: FW / 2, y: FH / 2 },
          hs: 0, gs: 0, serve: 1, freeze: 0, ts: Date.now() });
      } catch (e) { alert('Could not send invite: ' + e.message); return; }
      ahView('ahGame'); showNet('Waiting for Accept…', true);
      listenDuel(ref.id);
      inviteTimer = setTimeout(async () => {
        if (netPhase !== 'waiting') return;
        try { await updateDoc(ref, { status: 'expired' }); } catch (e) {}
        onRejected();
      }, 20000);
    }

    function listenDuel(id) {
      stopDuel();
      unsubDuel = onSnapshot(doc(db, 'duels', id), d => {
        const v = d.data(); netState = v; if (!v) return;
        if (netPhase === 'waiting') {
          if (v.status === 'accepted') onAccepted();
          else if (v.status === 'rejected' || v.status === 'expired') onRejected();
        } else if (netPhase === 'playing' && v.status === 'done' && !netEnded) {
          onNetDone(v);
        }
      });
    }
    function stopDuel() { if (unsubDuel) { unsubDuel(); unsubDuel = null; } }

    function onAccepted() {
      if (inviteTimer) { clearTimeout(inviteTimer); inviteTimer = null; }
      netPhase = 'playing'; ding(); showNet('Player Joined!', false);
      setTimeout(() => { hideNet(); startNetHost(myDuelId); }, 1000);
    }
    function onRejected() {
      netPhase = null; buzz(); showNet('Game Rejected… Exiting', false);
      setTimeout(() => { hideNet(); cleanupNet(); ahView('ahOnline'); }, 1600);
    }
    function onNetDone(v) {
      netEnded = true; stopGame();
      const iWon = netRole === 'host' ? v.winner === 'host' : v.winner === 'guest';
      setCoins(AH.coins + (iWon ? 50 : 10));
      $('ahResultText').textContent = (iWon ? 'You win the duel! 🏆' : 'You lost the duel 😿') + '\n+' + (iWon ? 50 : 10) + ' 🪙';
      $('ahResult').style.display = 'flex';
      $('ahResultBtn').onclick = () => { $('ahResult').style.display = 'none'; cleanupNet(); ahView('ahOnline'); };
    }
    $('ahNetCancel').addEventListener('click', async () => {
      if (myDuelId) { try { await updateDoc(doc(db, 'duels', myDuelId), { status: 'expired' }); } catch (e) {} }
      hideNet(); cleanupNet(); ahView('ahOnline');
    });
    function cleanupNet() {
      if (inviteTimer) { clearTimeout(inviteTimer); inviteTimer = null; }
      stopDuel(); if (unsubInviteDoc) { unsubInviteDoc(); unsubInviteDoc = null; }
      if (myDuelId && netRole === 'host') { try { deleteDoc(doc(db, 'duels', myDuelId)); } catch (e) {} }
      myDuelId = null; netRole = null; netPhase = null; netState = null; netEnded = false; currentInviteId = null;
    }
    function leaveOnline() { stopLobby(); stopIncoming(); stopPresence(); if (netPhase) cleanupNet(); seenInvites.clear(); }

    function applyInput(g, bottom) {
      let x = bottom ? g.px : g.ox, y = bottom ? g.py : g.oy;
      if (keyL) x -= 6; if (keyR) x += 6;
      if (keyU) y -= 6; if (keyD) y += 6;
      if (targetX != null) { x += (targetX - x) * 0.4; y += (targetY - y) * 0.4; }
      x = clamp(x, g.pr, g.W - g.pr);
      y = bottom ? clamp(y, g.H * 0.52 + g.pr, g.H - g.pr) : clamp(y, g.pr, g.H * 0.48 - g.pr);
      if (bottom) { g.px = x; g.py = y; } else { g.ox = x; g.oy = y; }
    }
    function newNetGame() {
      return { cfg: { target: 7 }, W: FW, H: FH, hs: 0, gs: 0, pr: 16, kr: 13,
        px: FW / 2, py: FH * 0.8, ox: FW / 2, oy: FH * 0.2, bx: FW / 2, by: FH / 2, bvx: 0, bvy: 0, freeze: 0, serveDir: 1 };
    }
    function startNetHost(id) {
      ahView('ahGame'); $('ahOppName').textContent = 'Duel vs ' + (netState ? netState.guest : '');
      if (!three) initScene(); else applyPuckSkin();
      setCam(false);
      game = newNetGame(); game.mode = 'host';
      sizeCanvas(); resetPuck(1);
      $('ahYou').textContent = 0; $('ahOpp').textContent = 0;
      netTickHost();
    }
    function startNetGuest(id) {
      ahView('ahGame'); $('ahOppName').textContent = 'Duel vs ' + (netState ? netState.host : '');
      if (!three) initScene(); else applyPuckSkin();
      setCam(true);
      game = newNetGame(); game.mode = 'guest';
      sizeCanvas();
      $('ahYou').textContent = 0; $('ahOpp').textContent = 0;
      netTickGuest();
    }
    function netTickHost() {
      if (!game || game.mode !== 'host') return;
      const g = game, ppx = g.px, ppy = g.py;
      applyInput(g, true);
      const pvx = g.px - ppx, pvy = g.py - ppy;
      let ovx = 0, ovy = 0;
      if (netState && netState.gp) { const ox0 = g.ox, oy0 = g.oy; g.ox += (netState.gp.x - g.ox) * 0.5; g.oy += (netState.gp.y - g.oy) * 0.5; ovx = g.ox - ox0; ovy = g.oy - oy0; }
      const now = performance.now();
      if (!g.freeze || now >= g.freeze) {
        if (g.freeze) { g.freeze = 0; g.bvx = (Math.random() * 2 - 1) * 2; g.bvy = g.serveDir * 3.4; }
        const who = stepPuck(g, pvx, pvy, ovx, ovy);
        if (who) { if (who === 'you') g.hs++; else g.gs++; netGoalHost(who); }
      }
      $('ahYou').textContent = g.hs; $('ahOpp').textContent = g.gs;
      if (now - netWriteT > 90) { netWriteT = now; try { updateDoc(doc(db, 'duels', myDuelId), { hp: { x: g.px, y: g.py }, puck: { x: g.bx, y: g.by }, hs: g.hs, gs: g.gs, serve: g.serveDir, freeze: g.freeze || 0, ts: Date.now() }); } catch (e) {} }
      render();
      raf = requestAnimationFrame(netTickHost);
    }
    function netGoalHost(who) {
      showGoal(); goalSound();
      const g = game;
      if (g.hs >= g.cfg.target || g.gs >= g.cfg.target) { netEndHost(g.hs > g.gs); return; }
      g.bx = g.W / 2; g.by = g.H / 2; g.bvx = 0; g.bvy = 0; g.serveDir = who === 'you' ? -1 : 1; g.freeze = performance.now() + 1600;
      try { updateDoc(doc(db, 'duels', myDuelId), { puck: { x: g.bx, y: g.by }, hs: g.hs, gs: g.gs, serve: g.serveDir, freeze: g.freeze }); } catch (e) {}
    }
    function netEndHost(hostWon) {
      netEnded = true; stopGame();
      try { updateDoc(doc(db, 'duels', myDuelId), { status: 'done', winner: hostWon ? 'host' : 'guest' }); } catch (e) {}
      setCoins(AH.coins + (hostWon ? 50 : 10));
      $('ahResultText').textContent = (hostWon ? 'You win the duel! 🏆' : 'You lost the duel 😿') + '\n+' + (hostWon ? 50 : 10) + ' 🪙';
      $('ahResult').style.display = 'flex';
      $('ahResultBtn').onclick = () => { $('ahResult').style.display = 'none'; cleanupNet(); ahView('ahOnline'); };
    }
    function netTickGuest() {
      if (!game || game.mode !== 'guest') return;
      const g = game;
      applyInput(g, false);
      if (netState) {
        if (netState.hp) { g.px = netState.hp.x; g.py = netState.hp.y; }
        if (netState.puck) { g.bx = netState.puck.x; g.by = netState.puck.y; }
        g.hs = netState.hs || 0; g.gs = netState.gs || 0;
      }
      $('ahYou').textContent = g.gs; $('ahOpp').textContent = g.hs;
      const now = performance.now();
      if (now - netWriteT > 90) { netWriteT = now; try { updateDoc(doc(db, 'duels', myDuelId), { gp: { x: g.ox, y: g.oy }, ts: Date.now() }); } catch (e) {} }
      render();
      raf = requestAnimationFrame(netTickGuest);
    }

    // ---- INPUT ----
    window.addEventListener('keydown', e => {
      if ($('airhockey').classList.contains('inactive')) return;
      const k = e.key;
      if (k === 'a' || k === 'A' || k === 'ArrowLeft') { keyL = true; e.preventDefault(); }
      if (k === 'd' || k === 'D' || k === 'ArrowRight') { keyR = true; e.preventDefault(); }
      if (k === 'w' || k === 'W' || k === 'ArrowUp') { keyU = true; e.preventDefault(); }
      if (k === 's' || k === 'S' || k === 'ArrowDown') { keyD = true; e.preventDefault(); }
    });
    window.addEventListener('keyup', e => {
      const k = e.key;
      if (k === 'a' || k === 'A' || k === 'ArrowLeft') keyL = false;
      if (k === 'd' || k === 'D' || k === 'ArrowRight') keyR = false;
      if (k === 'w' || k === 'W' || k === 'ArrowUp') keyU = false;
      if (k === 's' || k === 'S' || k === 'ArrowDown') keyD = false;
    });
    function pointerGame(clientX, clientY) {
      if (!three) return null;
      const r = cvs.getBoundingClientRect();
      const nx = ((clientX - r.left) / r.width) * 2 - 1, ny = -((clientY - r.top) / r.height) * 2 + 1;
      raycaster.setFromCamera(new THREE.Vector2(nx, ny), three.camera);
      const hit = new THREE.Vector3();
      if (!raycaster.ray.intersectPlane(tablePlane, hit)) return null;
      return { gx: hit.x / S + FW / 2, gy: hit.z / S + FH / 2 };
    }
    function setTarget(cx, cy) { const p = pointerGame(cx, cy); if (p) { targetX = p.gx; targetY = p.gy; } }
    cvs.addEventListener('touchstart', e => { setTarget(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); }, { passive: false });
    cvs.addEventListener('touchmove', e => { setTarget(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); }, { passive: false });
    cvs.addEventListener('touchend', () => { targetX = null; targetY = null; });
    cvs.addEventListener('mousedown', e => setTarget(e.clientX, e.clientY));
    cvs.addEventListener('mousemove', e => { if (e.buttons) setTarget(e.clientX, e.clientY); });
    window.addEventListener('mouseup', () => { targetX = null; targetY = null; });
    window.addEventListener('resize', () => { if (three) sizeCanvas(); });
  })();
  </script>
</body>
</html>
