<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colton's Site</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Courier New', Courier, monospace;
      color: #00ff41;
    }
    #matrix {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: block;
      z-index: 0;
    }

    /* ---- Screen system ---- */
    .screen {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: transform 0.8s cubic-bezier(0.7, 0, 0.3, 1), opacity 0.6s ease;
    }
    .screen.hidden-up   { transform: translateY(-100%); opacity: 0; pointer-events: none; }
    .screen.hidden-down { transform: translateY(100%);  opacity: 0; pointer-events: none; }
    .screen.inactive    { opacity: 0; pointer-events: none; }

    /* ---- Intro ---- */
    .title {
      color: #00ff41;
      font-size: clamp(2.5rem, 9vw, 7rem);
      font-weight: bold;
      letter-spacing: 0.1em;
      text-shadow: 0 0 10px #00ff41, 0 0 20px #00ff41, 0 0 40px #00ff41, 0 0 80px #008f11;
      animation: flicker 3s infinite alternate;
      user-select: none;
      text-align: center;
    }
    @keyframes flicker {
      0%, 92%, 100% { opacity: 1; }
      93% { opacity: 0.6; } 94% { opacity: 1; }
      96% { opacity: 0.4; } 97% { opacity: 1; }
    }
    .btn {
      margin-top: 2.5rem;
      padding: 0.9rem 3rem;
      font-family: inherit;
      font-size: clamp(1rem, 3vw, 1.6rem);
      font-weight: bold;
      letter-spacing: 0.15em;
      color: #00ff41;
      background: rgba(0, 0, 0, 0.4);
      border: 2px solid #00ff41;
      border-radius: 4px;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 0 10px #00ff41, inset 0 0 10px rgba(0, 255, 65, 0.2);
      transition: all 0.25s ease;
    }
    .btn:hover { background: #00ff41; color: #000; box-shadow: 0 0 25px #00ff41, 0 0 50px #00ff41; transform: scale(1.05); }
    .btn:active { transform: scale(0.97); }

    /* ---- Login (red) ---- */
    .login-box {
      width: min(90%, 380px);
      padding: 2.2rem 2rem;
      background: rgba(20, 0, 0, 0.72);
      border: 2px solid #ff0033;
      border-radius: 10px;
      box-shadow: 0 0 25px rgba(255, 0, 51, 0.6), inset 0 0 20px rgba(255, 0, 51, 0.15);
      color: #ff3355;
      text-align: center;
    }
    .login-box h2 {
      font-size: 1.9rem;
      letter-spacing: 0.2em;
      text-shadow: 0 0 12px #ff0033;
      margin-bottom: 1.5rem;
      text-transform: uppercase;
    }
    .field {
      width: 100%;
      margin-bottom: 1rem;
      padding: 0.8rem 1rem;
      background: rgba(0,0,0,0.5);
      border: 1px solid #ff0033;
      border-radius: 5px;
      color: #ff5566;
      font-family: inherit;
      font-size: 1rem;
      outline: none;
    }
    .field:focus { box-shadow: 0 0 12px #ff0033; }
    .trust {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: #ff6677;
      margin: 0.3rem 0 1.4rem;
      cursor: pointer;
      user-select: none;
      text-align: left;
    }
    .trust input { width: 16px; height: 16px; accent-color: #ff0033; }
    .btn-red {
      width: 100%;
      padding: 0.85rem;
      font-family: inherit;
      font-size: 1.1rem;
      font-weight: bold;
      letter-spacing: 0.15em;
      color: #ff3355;
      background: rgba(0,0,0,0.4);
      border: 2px solid #ff0033;
      border-radius: 5px;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 0 10px #ff0033, inset 0 0 10px rgba(255,0,51,0.2);
      transition: all 0.2s ease;
    }
    .btn-red:hover { background: #ff0033; color: #000; box-shadow: 0 0 25px #ff0033; }
    .btn-red:active { transform: scale(0.98); }

    /* ---- Home ---- */
    .home-inner {
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 2rem 1rem 1.5rem;
    }
    .home-header { text-align: center; }
    .home-header .welcome { font-size: 1rem; color: #00ff41cc; letter-spacing: 0.2em; }
    .home-header .user { font-size: 2rem; color: #00ff41; text-shadow: 0 0 15px #00ff41; margin-top: 0.3rem; }
    .logout {
      position: absolute; top: 1rem; right: 1rem;
      font-size: 0.75rem; color: #00ff4199;
      background: none; border: 1px solid #00ff4155;
      padding: 0.35rem 0.7rem; border-radius: 4px; cursor: pointer;
      font-family: inherit;
    }
    .logout:hover { color: #00ff41; border-color: #00ff41; }
    .dock {
      display: flex;
      justify-content: center;
      gap: 1.6rem;
      padding-bottom: 0.5rem;
    }
    .app {
      width: 78px; height: 78px;
      border-radius: 18px;
      background: rgba(0, 20, 5, 0.75);
      border: 1px solid #00ff4155;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(0,255,65,0.25);
      transition: all 0.2s ease;
    }
    .app:hover { transform: translateY(-6px) scale(1.05); box-shadow: 0 0 22px rgba(0,255,65,0.6); }
    .app .label {
      position: absolute; margin-top: 62px;
      font-size: 0.65rem; color: #00ff41aa; letter-spacing: 0.05em;
    }
    .app.locked { color: #00ff4166; }

    /* ---- Messages app ---- */
    .msg-app {
      width: min(100%, 480px);
      height: 100%;
      margin: 0 auto;
      background: rgba(0, 8, 3, 0.9);
      border-left: 1px solid #00ff4133;
      border-right: 1px solid #00ff4133;
      display: flex;
      flex-direction: column;
    }
    .msg-top {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem;
      border-bottom: 1px solid #00ff4133;
    }
    .msg-top .back { cursor: pointer; font-size: 1.3rem; color: #00ff41; background: none; border: none; font-family: inherit; }
    .msg-top .heading { font-size: 1.2rem; letter-spacing: 0.15em; color: #00ff41; text-shadow: 0 0 10px #00ff41; }
    .msg-top .plus {
      cursor: pointer; font-size: 1.5rem; color: #00ff41;
      background: none; border: 1px solid #00ff4155; border-radius: 50%;
      width: 34px; height: 34px; line-height: 1; font-family: inherit;
    }
    .msg-top .plus:hover { background: #00ff41; color: #000; }
    .conv-list { flex: 1; overflow-y: auto; }
    .conv {
      padding: 0.9rem 1rem;
      border-bottom: 1px solid #00ff4118;
      cursor: pointer;
      display: flex; flex-direction: column; gap: 0.2rem;
    }
    .conv:hover { background: rgba(0,255,65,0.06); }
    .conv .name { color: #00ff41; font-size: 1.05rem; }
    .conv .preview { color: #00ff4188; font-size: 0.8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .empty-note { padding: 2rem 1rem; text-align: center; color: #00ff4177; font-size: 0.9rem; line-height: 1.5; }

    /* chat thread */
    .thread { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
    .bubble {
      max-width: 75%;
      padding: 0.6rem 0.9rem;
      border-radius: 14px;
      font-size: 0.95rem;
      line-height: 1.35;
      word-wrap: break-word;
    }
    .bubble.me { align-self: flex-end; background: #00662a; color: #d6ffe4; border-bottom-right-radius: 4px; }
    .bubble.them { align-self: flex-start; background: rgba(0,255,65,0.12); color: #baffcf; border: 1px solid #00ff4133; border-bottom-left-radius: 4px; }
    .composer {
      display: flex; gap: 0.5rem; padding: 0.8rem; border-top: 1px solid #00ff4133;
    }
    .composer input {
      flex: 1; padding: 0.7rem 1rem;
      background: rgba(0,0,0,0.5); border: 1px solid #00ff4155; border-radius: 20px;
      color: #d6ffe4; font-family: inherit; font-size: 0.95rem; outline: none;
    }
    .composer input:focus { box-shadow: 0 0 10px rgba(0,255,65,0.4); }
    .composer button {
      padding: 0 1.2rem; background: #00ff41; color: #000; border: none;
      border-radius: 20px; font-family: inherit; font-weight: bold; cursor: pointer;
    }
    .net-note {
      font-size: 0.7rem; color: #00ff4166; text-align: center; padding: 0.4rem;
      border-top: 1px solid #00ff4118;
    }
  </style>
</head>
<body>
  <canvas id="matrix"></canvas>

  <!-- ===== INTRO ===== -->
  <div class="screen" id="intro">
    <div class="title">Colton's Site</div>
    <button class="btn" id="letsGoBtn">Let's go!</button>
  </div>

  <!-- ===== LOGIN ===== -->
  <div class="screen inactive" id="login">
    <div class="login-box">
      <h2>Access</h2>
      <input class="field" id="loginUser" type="text" autocomplete="username">
      <input class="field" id="loginPass" type="password" autocomplete="current-password">
      <label class="trust">
        <input type="checkbox" id="trustDevice"> Always trust this device with logins
      </label>
      <button class="btn-red" id="loginBtn">Log In</button>
    </div>
  </div>

  <!-- ===== HOME ===== -->
  <div class="screen inactive" id="home">
    <button class="logout" id="logoutBtn">Log out</button>
    <div class="home-inner">
      <div class="home-header">
        <div class="welcome">WELCOME BACK</div>
        <div class="user" id="homeUser">Colton</div>
      </div>
      <div class="dock">
        <div class="app locked" title="Coming soon">?</div>
        <div class="app" id="messagesApp">💬<span class="label">Messages</span></div>
        <div class="app locked" title="Coming soon">?</div>
      </div>
    </div>
  </div>

  <!-- ===== MESSAGES ===== -->
  <div class="screen inactive" id="messages">
    <div class="msg-app">
      <!-- conversation list view -->
      <div id="listView" style="display:flex;flex-direction:column;height:100%;">
        <div class="msg-top">
          <button class="back" id="msgHome">‹</button>
          <div class="heading">Messages</div>
          <button class="plus" id="newChatBtn">+</button>
        </div>
        <div class="conv-list" id="convList"></div>
        <div class="net-note">Local demo — real cross-net delivery needs a backend (ask Claude to add one)</div>
      </div>

      <!-- single chat view -->
      <div id="chatView" style="display:none;flex-direction:column;height:100%;">
        <div class="msg-top">
          <button class="back" id="chatBack">‹</button>
          <div class="heading" id="chatName">Contact</div>
          <span style="width:34px;"></span>
        </div>
        <div class="thread" id="thread"></div>
        <div class="composer">
          <input id="msgInput" type="text" placeholder="Type a message…">
          <button id="sendBtn">Send</button>
        </div>
      </div>
    </div>
  </div>

  <script>
  /* =========================================================
     MATRIX BACKGROUND
     ========================================================= */
  const canvas = document.getElementById('matrix');
  const ctx = canvas.getContext('2d');
  const fontSize = 16;
  let columns, drops;

  // character sets + colors per mode
  const MODES = {
    intro: { chars: 'アイウエオカキクケコサシスセソタチツテトABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%'.split(''), color: '#00ff41' },
    binary:{ chars: ['0','1'], color: '#ff0033' },   // real-matrix 1s and 0s, red for login
    calm:  { chars: ['0','1'], color: '#00ff41' }    // green binary once inside
  };
  let mode = MODES.intro;

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    columns = Math.floor(canvas.width / fontSize);
    drops = new Array(columns).fill(1);
  }
  resize();
  window.addEventListener('resize', resize);

  function draw() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = mode.color;
    ctx.font = fontSize + 'px monospace';
    for (let i = 0; i < drops.length; i++) {
      const text = mode.chars[Math.floor(Math.random() * mode.chars.length)];
      ctx.fillText(text, i * fontSize, drops[i] * fontSize);
      if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
  }
  setInterval(draw, 40);

  /* =========================================================
     ACCOUNT + AUTO LOGIN
     ========================================================= */
  const ACCOUNT = { user: 'Colton', pass: 'matrix' };  // the auto-login account
  const TRUST_KEY = 'colton_trust_device';

  function showScreen(id) {
    // helper to move between login/home/messages without the up-slide
    ['login','home','messages'].forEach(s => {
      document.getElementById(s).classList.add('inactive');
      document.getElementById(s).classList.remove('hidden-up');
    });
    const el = document.getElementById(id);
    el.classList.remove('inactive');
  }

  // Pre-fill the account credentials
  document.getElementById('loginUser').value = ACCOUNT.user;
  document.getElementById('loginPass').value = ACCOUNT.pass;

  // "Let's go!" -> slide intro UP -> reveal red login (binary matrix)
  document.getElementById('letsGoBtn').addEventListener('click', () => {
    // If device is already trusted, skip straight to home
    if (localStorage.getItem(TRUST_KEY) === 'yes') {
      mode = MODES.calm;
      document.getElementById('intro').classList.add('hidden-up');
      enterHome();
      return;
    }
    mode = MODES.binary;                       // numbers become 1s and 0s, red
    document.getElementById('intro').classList.add('hidden-up');
    document.getElementById('login').classList.remove('inactive');
  });

  // Log in
  document.getElementById('loginBtn').addEventListener('click', () => {
    if (document.getElementById('trustDevice').checked) {
      localStorage.setItem(TRUST_KEY, 'yes');
    }
    mode = MODES.calm;
    enterHome();
  });

  function enterHome() {
    document.getElementById('homeUser').textContent = ACCOUNT.user;
    showScreen('home');
  }

  // Log out (clears trust so login shows again)
  document.getElementById('logoutBtn').addEventListener('click', () => {
    localStorage.removeItem(TRUST_KEY);
    mode = MODES.intro;
    ['login','home','messages'].forEach(s => document.getElementById(s).classList.add('inactive'));
    document.getElementById('intro').classList.remove('hidden-up');
  });

  /* =========================================================
     MESSAGES APP  (stored locally in this browser)
     ========================================================= */
  const CONV_KEY = 'colton_convos';
  let convos = JSON.parse(localStorage.getItem(CONV_KEY) || '{}');
  let currentContact = null;

  function saveConvos() { localStorage.setItem(CONV_KEY, JSON.stringify(convos)); }

  document.getElementById('messagesApp').addEventListener('click', () => {
    showScreen('messages');
    openList();
  });
  document.getElementById('msgHome').addEventListener('click', () => showScreen('home'));

  function openList() {
    document.getElementById('listView').style.display = 'flex';
    document.getElementById('chatView').style.display = 'none';
    renderConvList();
  }

  function renderConvList() {
    const list = document.getElementById('convList');
    const names = Object.keys(convos);
    if (names.length === 0) {
      list.innerHTML = '<div class="empty-note">No chats yet.<br>Tap the <b>+</b> in the top-right to look up an account and start texting.</div>';
      return;
    }
    list.innerHTML = '';
    names.forEach(name => {
      const msgs = convos[name];
      const last = msgs.length ? msgs[msgs.length - 1].text : '';
      const div = document.createElement('div');
      div.className = 'conv';
      div.innerHTML = `<span class="name">${escapeHtml(name)}</span><span class="preview">${escapeHtml(last)}</span>`;
      div.addEventListener('click', () => openChat(name));
      list.appendChild(div);
    });
  }

  // + button: look up an account across the net and start a chat
  document.getElementById('newChatBtn').addEventListener('click', () => {
    const name = prompt('Look up an account to text (enter a username):');
    if (!name) return;
    const clean = name.trim();
    if (!clean) return;
    if (!convos[clean]) { convos[clean] = []; saveConvos(); }
    openChat(clean);
  });

  function openChat(name) {
    currentContact = name;
    document.getElementById('chatName').textContent = name;
    document.getElementById('listView').style.display = 'none';
    document.getElementById('chatView').style.display = 'flex';
    renderThread();
    document.getElementById('msgInput').focus();
  }

  document.getElementById('chatBack').addEventListener('click', openList);

  function renderThread() {
    const thread = document.getElementById('thread');
    thread.innerHTML = '';
    (convos[currentContact] || []).forEach(m => {
      const b = document.createElement('div');
      b.className = 'bubble ' + (m.from === 'me' ? 'me' : 'them');
      b.textContent = m.text;
      thread.appendChild(b);
    });
    thread.scrollTop = thread.scrollHeight;
  }

  function sendMessage() {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if (!text) return;
    convos[currentContact].push({ from: 'me', text });
    saveConvos();
    input.value = '';
    renderThread();
  }
  document.getElementById('sendBtn').addEventListener('click', sendMessage);
  document.getElementById('msgInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') sendMessage();
  });

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  </script>
</body>
</html>
