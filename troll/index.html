<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>Troll Square</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161c26;
    --line: #2a3342;
    --ink: #e6edf3;
    --dim: #8b98a9;
    --hot: #ef4444;
    --go: #4ade80;
    --gold: #fbbf24;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    display: flex; flex-direction: column; height: 100vh; height: 100dvh;
    user-select: none;
  }
  button { font-family: inherit; color: inherit; cursor: pointer; }
  .view { display: none; flex: 1; min-height: 0; flex-direction: column; }
  .view.on { display: flex; }

  .btn {
    background: var(--panel); border: 1px solid var(--line); color: var(--ink);
    border-radius: 11px; padding: 0.5rem 0.85rem; font-size: 0.85rem; font-weight: 700;
    white-space: nowrap;
  }
  .btn:hover { background: #1e2733; border-color: #3a465a; }
  .btn:active { transform: translateY(1px); }
  .btn.hot { background: var(--hot); border-color: var(--hot); color: #fff; }
  .btn.go { background: var(--go); border-color: var(--go); color: #06240f; }
  .btn.small { padding: 0.35rem 0.6rem; font-size: 0.76rem; }
  .btn.off { opacity: 0.45; }

  .bar {
    display: flex; align-items: center; gap: 0.5rem; padding: 0.55rem 0.8rem;
    background: var(--panel); border-bottom: 1px solid var(--line); flex: none;
    padding-top: calc(0.55rem + env(safe-area-inset-top));
  }
  .bar a { color: var(--dim); text-decoration: none; font-size: 0.8rem;
           border: 1px solid var(--line); border-radius: 10px; padding: 0.35rem 0.6rem; }
  .bar a:hover { color: var(--ink); }
  .grow { flex: 1; }
  .title { font-weight: 900; letter-spacing: -0.02em; font-size: 1rem; }
  .title b { color: var(--hot); }

  /* ------------------------------- world map ------------------------------ */
  #map { align-items: center; justify-content: center; overflow: hidden; position: relative; }
  #mapScroll { flex: 1; width: 100%; overflow-y: auto; overflow-x: hidden;
               padding: 1.4rem 1rem 2.4rem; perspective: 1100px; }
  .maptitle { text-align: center; margin: 0 0 1.4rem; }
  .maptitle h1 { font-size: 1.9rem; margin: 0; font-weight: 900; letter-spacing: -0.03em; }
  .maptitle h1 b { color: var(--hot); }
  .maptitle p { color: var(--dim); font-size: 0.85rem; margin: 0.3rem 0 0; }

  /* the 3D board: a tilted plane of world tiles you look down onto */
  .board {
    max-width: 860px; margin: 0 auto; display: grid;
    grid-template-columns: repeat(4, 1fr); gap: 1.1rem;
    transform: rotateX(24deg); transform-style: preserve-3d;
  }
  @media (max-width: 620px) { .board { grid-template-columns: repeat(2, 1fr); transform: rotateX(14deg); } }
  .wtile {
    position: relative; border-radius: 16px; padding: 0.9rem 0.8rem 0.8rem;
    border: 2px solid var(--line); background: var(--panel); text-align: left;
    transform-style: preserve-3d; transition: transform 0.18s ease, box-shadow 0.18s ease;
    min-height: 132px; display: flex; flex-direction: column;
  }
  .wtile::after {           /* the slab's side, so it reads as a solid block */
    content: ''; position: absolute; left: 4px; right: 4px; bottom: -13px; height: 15px;
    background: #0a0e14; border-radius: 0 0 14px 14px; transform: translateZ(-1px);
  }
  .wtile:hover:not(.locked) { transform: translateZ(30px) translateY(-6px); }
  .wtile.locked { opacity: 0.4; cursor: default; }
  .wtile .no { font-size: 0.68rem; color: var(--dim); font-weight: 700; letter-spacing: 0.14em; }
  .wtile .nm { font-size: 1rem; font-weight: 900; margin-top: 0.15rem; }
  .wtile .sb { font-size: 0.7rem; color: var(--dim); margin-top: 0.1rem; font-style: italic; }
  .wtile .pips { display: flex; gap: 5px; margin-top: auto; padding-top: 0.7rem; }
  .wtile .pip { width: 13px; height: 13px; border-radius: 4px; border: 2px solid var(--line); }
  .wtile .pip.done { background: var(--go); border-color: var(--go); }
  .wtile .pip.boss { border-radius: 50%; }
  .wtile .pip.boss.done { background: var(--gold); border-color: var(--gold); }
  .wtile .lock { position: absolute; right: 10px; top: 10px; font-size: 1rem; }

  /* ------------------------------ stage picker ---------------------------- */
  #stages { padding: 1.2rem 1rem; overflow-y: auto; }
  .slist { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 0.6rem; }
  .srow {
    display: flex; align-items: center; gap: 0.8rem; padding: 0.75rem 0.9rem;
    border: 1px solid var(--line); border-radius: 13px; background: var(--panel); text-align: left;
  }
  .srow:hover:not(.locked) { border-color: #4a5a72; background: #1b2431; }
  .srow.locked { opacity: 0.4; cursor: default; }
  .srow .ico { font-size: 1.2rem; width: 26px; text-align: center; }
  .srow .nm { flex: 1; font-weight: 700; font-size: 0.92rem; }
  .srow .nm small { display: block; font-weight: 400; color: var(--dim); font-size: 0.72rem; margin-top: 2px; }
  .srow .best { font-size: 0.72rem; color: var(--dim); text-align: right; }

  /* --------------------------------- game --------------------------------- */
  #play { position: relative; }
  #wrap { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; padding: 0.4rem; }
  canvas { image-rendering: pixelated; border-radius: 8px; max-width: 100%; max-height: 100%;
           box-shadow: 0 10px 40px rgba(0,0,0,0.55); touch-action: none; }
  .hud {
    display: flex; align-items: center; gap: 0.6rem; padding: 0.45rem 0.8rem;
    background: var(--panel); border-bottom: 1px solid var(--line); flex: none; font-size: 0.8rem;
    padding-top: calc(0.45rem + env(safe-area-inset-top));
  }
  .hud .st { color: var(--dim); }
  .hud .st b { color: var(--ink); }
  .deaths { color: var(--hot); font-weight: 800; font-variant-numeric: tabular-nums; }

  .banner {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(6,9,14,0.82); z-index: 12; padding: 1rem;
  }
  .banner.on { display: flex; }
  .bcard {
    background: var(--panel); border: 2px solid var(--line); border-radius: 18px;
    padding: 1.4rem 1.6rem; text-align: center; max-width: 340px;
  }
  .bcard h2 { margin: 0 0 0.3rem; font-size: 1.4rem; font-weight: 900; }
  .bcard p { color: var(--dim); font-size: 0.84rem; margin: 0 0 1rem; line-height: 1.55; }
  .bcard .row { display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; }

  /* touch controls, only on the small screens that need them */
  #pad { display: none; gap: 0.5rem; padding: 0.5rem 0.7rem calc(0.7rem + env(safe-area-inset-bottom)); flex: none; }
  #pad button {
    flex: 1; background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    font-size: 1.5rem; padding: 0.75rem 0; color: var(--ink);
  }
  #pad button:active { background: #26303e; }
  #pad .jump { flex: 1.6; background: #223047; }
  body.touch #pad { display: flex; }

  .hint { text-align: center; color: var(--dim); font-size: 0.74rem; padding: 0 0.8rem 0.4rem; flex: none; }
</style>
</head>
<body>

<!-- =============================== MAP =============================== -->
<div class="view on" id="map">
  <div class="bar">
    <a href="../">← Phone</a>
    <div class="title">TROLL <b>SQUARE</b></div>
    <div class="grow"></div>
    <button class="btn small" id="musicBtn">♪</button>
    <button class="btn small" id="sfxBtn">🔊</button>
    <button class="btn small" id="wipeBtn">Reset</button>
  </div>
  <div id="mapScroll">
    <div class="maptitle">
      <h1>Eight worlds. One <b>very</b> mean square.</h1>
      <p id="mapSub">Every level is possible. That is the only promise made here.</p>
    </div>
    <div class="board" id="board"></div>
  </div>
</div>

<!-- ============================= STAGE LIST ========================== -->
<div class="view" id="stages">
  <div class="bar">
    <button class="btn small" id="backMap">← Worlds</button>
    <div class="title" id="worldName"></div>
    <div class="grow"></div>
    <div class="st" id="worldStats" style="font-size:0.78rem;color:var(--dim)"></div>
  </div>
  <div style="flex:1;overflow-y:auto;padding:1.2rem 1rem;">
    <div class="slist" id="stageList"></div>
  </div>
</div>

<!-- ================================ GAME ============================= -->
<div class="view" id="play">
  <div class="hud">
    <button class="btn small" id="quitBtn">← Quit</button>
    <div class="st" id="stageName"></div>
    <div class="grow"></div>
    <div class="st">deaths <span class="deaths" id="deathCount">0</span></div>
    <button class="btn small" id="retryBtn">↺</button>
  </div>
  <div id="wrap"><canvas id="cv" width="960" height="384"></canvas></div>
  <div class="hint" id="stageHint"></div>
  <div id="pad">
    <button id="padL">◀</button>
    <button class="jump" id="padJ">JUMP</button>
    <button id="padR">▶</button>
  </div>

  <div class="banner" id="banner">
    <div class="bcard">
      <h2 id="bTitle">Nice</h2>
      <p id="bText"></p>
      <div class="row" id="bRow"></div>
    </div>
  </div>
</div>

<script type="module" src="game.js"></script>
</body>
</html>
