<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="The Red Rebellion">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b0b0b"/>
      <stop offset="0.55" stop-color="#120708"/>
      <stop offset="1" stop-color="#050303"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff4b3e"/>
      <stop offset="1" stop-color="#b4090f"/>
    </linearGradient>
    <filter id="rough" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="3" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="99" fill="none" stroke="#3a1113" stroke-width="4"/>

  <!-- torn red sail / flag behind -->
  <path d="M92 96 L420 96 L400 300 Q332 274 262 300 Q188 328 112 300 Z"
        fill="url(#red)" opacity="0.16" filter="url(#rough)"/>

  <g filter="url(#glow)">
    <g filter="url(#rough)" stroke="url(#red)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- crossbones -->
      <path d="M150 330 L362 214"/>
      <path d="M150 214 L362 330"/>
      <circle cx="150" cy="330" r="15"/><circle cx="150" cy="214" r="15"/>
      <circle cx="362" cy="330" r="15"/><circle cx="362" cy="214" r="15"/>

      <!-- pencil-comic cat-pirate skull head -->
      <circle cx="256" cy="248" r="86"/>
      <!-- ears -->
      <path d="M196 186 L188 140 L232 168"/>
      <path d="M316 186 L324 140 L280 168"/>
      <!-- eyes -->
      <circle cx="224" cy="238" r="12" fill="url(#red)"/>
      <circle cx="288" cy="238" r="12" fill="url(#red)"/>
      <!-- grin -->
      <path d="M212 288 Q256 322 300 288"/>
      <path d="M232 292 L232 308"/><path d="M256 300 L256 316"/><path d="M280 292 L280 308"/>
      <!-- whiskers -->
      <path d="M176 262 L136 252"/><path d="M176 276 L138 282"/>
      <path d="M336 262 L376 252"/><path d="M336 276 L374 282"/>
    </g>
  </g>

  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <text x="256" y="412" fill="#f6efe4" font-size="46" letter-spacing="10">THE RED</text>
    <text x="256" y="458" fill="url(#red)" font-size="46" letter-spacing="8" font-weight="bold">REBELLION</text>
  </g>
</svg>
